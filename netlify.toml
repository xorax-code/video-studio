[build]
  publish = "."
  command = "echo \"const SUPABASE_URL='$SUPABASE_URL'; const SUPABASE_ANON='$SUPABASE_ANON';\" > supabase-config.js"

[[redirects]]
  from = "/"
  to = "/landing.html"
  status = 200

[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

# ── COOP/COEP headers for /app — required for FFmpeg.wasm (SharedArrayBuffer) ──
[[headers]]
  for = "/app"
  [headers.values]
    Cross-Origin-Opener-Policy   = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"

[[headers]]
  for = "/app.html"
  [headers.values]
    Cross-Origin-Opener-Policy   = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions.openai-transcribe]
  node_version = "18"
  timeout = 26

[functions.openai-chat]
  node_version = "18"
  timeout = 26

[functions.create-checkout-session]
  node_version = "18"
  timeout = 26

[functions.create-portal-session]
  node_version = "18"
  timeout = 26

[functions.stripe-webhook]
  node_version = "18"
  timeout = 26

[functions.validate-promo]
  node_version = "18"
  timeout = 10

[functions.generate-veo-clip]
  node_version = "18"
  timeout = 26

[functions.poll-veo-clip]
  node_version = "18"
  timeout = 26

[functions.create-topup-session]
  node_version = "18"
  timeout = 26
