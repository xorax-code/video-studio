[build]
  publish = "."
  command = "echo \"const SUPABASE_URL='$SUPABASE_URL'; const SUPABASE_ANON='$SUPABASE_ANON';\" > supabase-config.js"

# ── Secrets scanning ──────────────────────────────────────────────────────────
# These keys are NOT secrets — they are public kie.ai model/route identifiers
# (e.g. veo3_lite, veo3_fast, veo3_quality, REFERENCE_2_VIDEO) whose values also
# live as default fallback strings in netlify/functions/_kie-veo.js. Because
# publish = ".", Netlify scans that source file and flags the value, failing the
# build. Omitting these keys stops the false positive. Real secrets — KIE_API_KEY,
# SUPABASE_SERVICE_ROLE_KEY, STRIPE_* — are deliberately NOT listed, so they stay
# scanned.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VEO_PROVIDER,KIE_BASE_URL,KIE_MODEL_LITE,KIE_MODEL_FAST,KIE_MODEL_STANDARD,KIE_MODEL_OMNI,KIE_GEN_TYPE_IMAGE,KIE_VEO_DETAIL_PATH,KIE_FRAME_BUCKET,KIE_JOBS_QUERY_PATH"

[[redirects]]
  from = "/"
  to = "/landing.html"
  status = 200

[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

# ── COOP only (COEP removed — it blocks googleapis.com video loading for Veo gallery) ──
# NOTE: Removing COEP means SharedArrayBuffer is unavailable for FFmpeg.wasm export.
# The gallery video playback and download work correctly without COEP.
# If FFmpeg export is re-enabled, use a service worker or a video proxy instead of COEP.
[[headers]]
  for = "/app"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
  for = "/app.html"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions.openai-transcribe]
  node_version = "18"
  timeout = 26

[functions.openai-chat]
  node_version = "18"
  timeout = 26

[functions.create-checkout-session]
  node_version = "18"
  timeout = 26

[functions.create-portal-session]
  node_version = "18"
  timeout = 26

[functions.stripe-webhook]
  node_version = "18"
  timeout = 26

[functions.validate-promo]
  node_version = "18"
  timeout = 10

[functions.generate-veo-clip]
  node_version = "18"
  timeout = 26

[functions.poll-veo-clip]
  node_version = "18"
  timeout = 26

[functions.create-topup-session]
  node_version = "18"
  timeout = 26

[functions.generate-nb-composite]
  node_version = "18"
  timeout = 26

[functions.producer-ai]
  node_version = "18"
  timeout = 26

# Async image composite. The "-background" worker auto-gets the 15-min budget —
# do NOT add a timeout here (it would cap it). poll is a trivial DB read.
[functions.generate-nb-composite-background]
  node_version = "18"

[functions.poll-nb-composite]
  node_version = "18"
