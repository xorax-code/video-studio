[build]
  publish = "."
  command = "echo \"const SUPABASE_URL='$SUPABASE_URL'; const SUPABASE_ANON='$SUPABASE_ANON';\" > supabase-config.js"

[[redirects]]
  from = "/"
  to = "/landing.html"
  status = 200

[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions.openai-transcribe]
  node_version = "18"
  timeout = 26

[functions.openai-chat]
  node_version = "18"
  timeout = 26

[functions.create-checkout-session]
  node_version = "18"
  timeout = 26

[functions.create-portal-session]
  node_version = "18"
  timeout = 26

[functions.stripe-webhook]
  node_version = "18"
  timeout = 26

[functions.validate-promo]
  node_version = "18"
  timeout = 10
